name: Deploy to GitHub Pages

# Gist 同期にしたことで、このアプリは静的ファイルだけで完結する。
# Pages に置けば PC でサーバーを動かす必要がなくなり、
# HTTPS になるのでスマホの PWA もオフライン起動できるようになる。
#
# Source = GitHub Actions への切り替えは configure-pages の enablement が行うので、
# Settings を手で触る必要はない。
# （プライベートリポジトリの Pages は有料プランが必要です）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 進行中の配信は止めない。Pages の配信は本番反映そのものなので、
  # 途中で切ると公開中のサイトが中途半端な状態になりうる。
  # 連続 push のときは、待ち行列の古いほうだけが捨てられる。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 本番ビルド
        # Pages はリポジトリ名のサブパスで配信されるため、相対パス (base: './') で出す。
        run: npm run build
      - name: 配信元を確かめる
        # 配信元が「Deploy from a branch」だと、push のたびに Jekyll の
        # "pages build and deployment" も走る。あとから完了したほうが勝つので、
        # ここでアプリを配信しても README で上書きされてしまう。
        #
        # 自動では直せない。GITHUB_TOKEN は pages: write があっても
        # PUT /repos/:owner/:repo/pages が 403 (Resource not accessible by
        # integration) になり、配信元だけは変更できないため。
        # configure-pages の enablement も「Pages が無ければ作る」だけ。
        # そのため、ここでは状態を見て、直し方をログに出すことに徹する。
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -sS -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            -d '{"build_type":"workflow"}' >/dev/null 2>&1 || true

          build_type=$(curl -sS \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/pages" \
            | sed -n 's/.*"build_type"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p')

          echo "build_type = ${build_type:-(取得できず)}"
          if [ "$build_type" = "workflow" ]; then
            echo "配信元は GitHub Actions です。このワークフローの出力がそのまま公開されます。"
            exit 0
          fi

          echo "::error title=Pages の配信元が GitHub Actions になっていません::Settings → Pages → Source を「GitHub Actions」に変えてください（1回だけ）。このままだと Jekyll のビルドがあとから上書きし、アプリではなく README が表示されます。設定画面: https://github.com/$GITHUB_REPOSITORY/settings/pages"
          {
            echo "### Pages の配信元を変えてください"
            echo
            echo "現在の配信元: \`${build_type:-不明}\`（「Deploy from a branch」）"
            echo
            echo "1. <https://github.com/$GITHUB_REPOSITORY/settings/pages> を開く"
            echo "2. **Build and deployment → Source** を **GitHub Actions** にする"
            echo "3. このワークフローを一度実行する（Actions → Deploy to GitHub Pages → Run workflow）"
            echo
            echo "この設定はワークフローからは変えられません"
            echo "（\`GITHUB_TOKEN\` では \`PUT /repos/:owner/:repo/pages\` が 403 になります）。"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/configure-pages@v5
        with:
          # Pages が未設定なら、このワークフローから配信する設定で作る。
          # これが無いと Settings → Pages を手で直すまで失敗し続ける。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
