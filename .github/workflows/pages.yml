name: Deploy to GitHub Pages

# Gist 同期にしたことで、このアプリは静的ファイルだけで完結する。
# Pages に置けば PC でサーバーを動かす必要がなくなり、
# HTTPS になるのでスマホの PWA もオフライン起動できるようになる。
#
# Source = GitHub Actions への切り替えは configure-pages の enablement が行うので、
# Settings を手で触る必要はない。
# （プライベートリポジトリの Pages は有料プランが必要です）
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # 進行中の配信は止めない。Pages の配信は本番反映そのものなので、
  # 途中で切ると公開中のサイトが中途半端な状態になりうる。
  # 連続 push のときは、待ち行列の古いほうだけが捨てられる。
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: 本番ビルド
        # Pages はリポジトリ名のサブパスで配信されるため、相対パス (base: './') で出す。
        run: npm run build
      - uses: actions/configure-pages@v5
        with:
          # Pages が未設定でも、このワークフローから配信するよう自動で切り替える。
          # これが無いと Settings → Pages を手で直すまで失敗し続ける。
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist
      - id: deployment
        uses: actions/deploy-pages@v4
