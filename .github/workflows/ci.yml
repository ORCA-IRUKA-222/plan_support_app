name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci

      - name: 型チェック
        run: npm run typecheck

      # ビルドを先に走らせる。静的配信のテストが app/dist を見るため。
      - name: 本番ビルド
        run: npm run build

      - name: テスト (フロントエンド + 同期サーバー)
        run: npm test

      - name: ブラウザを用意
        run: npx playwright install --with-deps chromium

      - name: 画面と同期の通し確認
        run: |
          npm run server &
          curl -s --retry 60 --retry-all-errors --retry-connrefused --retry-delay 1 \
               -o /dev/null http://127.0.0.1:8787/api/health
          npm run e2e -- http://127.0.0.1:8787
          npm run e2e:sync -- http://127.0.0.1:8787
          npm run e2e:diagrams -- http://127.0.0.1:8787
          # localhost だけだと Service Worker の secure-context 制約を見落とすので、
          # LAN の IP 経由 (平文HTTP) も渡して両方の挙動を確認する。
          LAN_IP=$(hostname -I | awk '{print $1}')
          npm run e2e:offline -- http://127.0.0.1:8787 "http://$LAN_IP:8787"
          # サーバーの停止・再開を含むので、専用のポートで自前に起動する
          npm run e2e:resume -- 8899 "$RUNNER_TEMP/resume.sqlite"

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: app/dist
          retention-days: 14
