name: Android APK

# APK は毎コミット作らず、必要なときに手動実行するかタグを打って作る。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 7 は Java 21 が必要

      - uses: android-actions/setup-android@v3
        with:
          # Capacitor 7 の既定: compileSdk 35 / AGP 8.7.2
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: npm ci
      - name: 本番ビルド
        run: npm run build
      - name: テスト
        run: npm test

      - name: APK をビルド
        run: ./scripts/build-apk.sh debug

      - name: APK の中身を確認
        run: |
          set -euo pipefail
          APK=$(find app/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "できた APK: $APK"
          ls -lh "$APK"

          echo "--- 画面一式が同梱されているか ---"
          unzip -l "$APK" | grep -q 'assets/public/index.html'
          echo "OK: assets/public/index.html"

          # LAN の同期サーバー (平文HTTP) につなぐには次の2つが両方必要。
          # どちらか欠けると実機で必ず Failed to fetch になるので、ここで落とす。
          echo "--- 混在コンテンツの許可 ---"
          unzip -p "$APK" assets/capacitor.config.json | tee /dev/stderr | grep -q '"allowMixedContent": *true'
          echo "OK: allowMixedContent"

          echo "--- 平文HTTPの許可 (マニフェストはバイナリなので aapt2 で読む) ---"
          AAPT2=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$AAPT2" dump xmltree --file AndroidManifest.xml "$APK" > manifest.txt
          grep 'usesCleartextTraffic' manifest.txt
          # aapt2 のバージョンによって "=true" と "(type 0x12)0xffffffff" のどちらでも出る。
          grep 'usesCleartextTraffic' manifest.txt | grep -qE '=true|0xffffffff'
          echo "OK: usesCleartextTraffic=true"

      - uses: actions/upload-artifact@v4
        with:
          name: kikaku-bansou-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
