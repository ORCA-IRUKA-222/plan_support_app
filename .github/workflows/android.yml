name: Android APK

# APK は毎コミット作らず、必要なときに手動実行するかタグを打って作る。
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'   # Capacitor 7 は Java 21 が必要

      - uses: android-actions/setup-android@v3
        with:
          # Capacitor 7 の既定: compileSdk 35 / AGP 8.7.2
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - run: npm ci
      - name: 本番ビルド
        run: npm run build
      - name: テスト
        run: npm test

      - name: APK をビルド
        run: ./scripts/build-apk.sh debug

      - name: APK を確認
        run: |
          APK=$(find app/android/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "できた APK: $APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep -E 'AndroidManifest|classes.dex|assets/public/index.html' || true

      - uses: actions/upload-artifact@v4
        with:
          name: kikaku-bansou-debug-apk
          path: app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
          if-no-files-found: error
